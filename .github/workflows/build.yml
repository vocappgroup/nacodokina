# Rebuilds the site every 30 minutes between 06:00 and 23:00 Warsaw time and commits public/index.html;
# Vercel's Git integration deploys every push to main.
# One run ≈ 700 requests to restapi.helios.pl (repertoire + today's seat occupancy).
name: build
on:
  schedule:
    - cron: '*/30 4-21 * * *'   # UTC; Warsaw is UTC+2 in summer, UTC+1 in winter
  workflow_dispatch:
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .cache
          key: imdb-ratings-${{ github.run_id }}
          restore-keys: imdb-ratings-
      - run: node fetch.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - run: node build.mjs
      - name: commit the built page (Vercel deploys on push)
        run: |
          git config user.name  "nacodokina-bot"
          git config user.email "kontakt@nacodokina.pl"
          git add imdb-cache.json public
          git diff --cached --quiet || (git commit -m "build $(TZ=Europe/Warsaw date '+%Y-%m-%d %H:%M')" && git push)
